<style>
  :root {
    --bg:#f4f6f8; --ink:#0f172a; --sub:#475569; --card:#ffffff; --line:#dbe1e8;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); font-family:Helvetica,Arial,sans-serif; color:var(--ink); }
  h1 { font-size:1.25rem; font-weight:700; text-align:center; margin:18px 12px 2px; }
  p.sub { text-align:center; color:var(--sub); font-size:0.85rem; margin:0 12px 14px; }
  .wrap { max-width:1040px; margin:0 auto; padding:0 12px 24px; }
  .map-box { position:relative; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:8px; }
  svg { width:100%; height:auto; display:block; }
  .marker-box { fill:#0f172a; fill-opacity:0.05; stroke:#0f172a; stroke-opacity:0.16; transition:fill-opacity .15s, stroke-opacity .15s; }
  .marker:hover .marker-box, .marker:focus .marker-box { fill-opacity:0.13; stroke-opacity:0.4; }
  .marker:focus { outline:none; }
  #tooltip {
    position:fixed; z-index:50; max-width:320px; background:var(--card); border:1px solid var(--line);
    border-radius:10px; box-shadow:0 8px 24px rgba(15,23,42,.14); padding:12px 14px; font-size:0.83rem;
    pointer-events:none; opacity:0; transform:translateY(4px); transition:opacity .12s, transform .12s;
  }
  #tooltip.show { opacity:1; transform:translateY(0); }
  #tooltip h3 { margin:0 0 6px; font-size:0.92rem; }
  #tooltip .item { margin:0 0 8px; padding-left:8px; border-left:3px solid #cbd5e1; }
  #tooltip .item:last-child { margin-bottom:0; }
  #tooltip .lieu { font-weight:700; font-size:0.82rem; }
  #tooltip .theme { display:inline-block; font-size:0.7rem; font-weight:700; padding:1px 6px; border-radius:5px; color:#fff; margin:2px 0 3px; }
  #tooltip .action { color:#334155; line-height:1.35; }
  #tooltip .porteur { color:var(--sub); font-size:0.74rem; margin-top:2px; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0f172a; --ink:#f1f5f9; --sub:#94a3b8; --card:#1e293b; --line:#334155; }
    :root:not([data-theme="light"]) svg rect:first-child { fill:#0f172a; }
    :root:not([data-theme="light"]) .marker-box { fill:#f1f5f9; stroke:#f1f5f9; }
  }
</style>

      <div class="lieu">${it.lieu}</div>
      <span class="theme" style="background:${color}">${it.theme}</span>
      <div class="action">${it.action}</div>
      <div class="porteur">Porteur : ${it.porteur}</div>
    </div>`;
  });
  tooltip.innerHTML = html;
}

function place(x, y) {
  const pad = 16;
  const vw = window.innerWidth, vh = window.innerHeight;
  const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
  let left = x + pad, top = y + pad;
  if (left + tw > vw - 8) left = x - tw - pad;
  if (top + th > vh - 8) top = y - th - pad;
  tooltip.style.left = Math.max(8, left) + 'px';
  tooltip.style.top = Math.max(8, top) + 'px';
}

document.querySelectorAll('.marker').forEach(marker => {
  const dept = marker.getAttribute('data-dept');
  marker.addEventListener('mouseenter', () => { render(dept); tooltip.classList.add('show'); });
  marker.addEventListener('mousemove', (e) => place(e.clientX, e.clientY));
  marker.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
  marker.addEventListener('focus', (e) => {
    render(dept);
    const r = marker.getBoundingClientRect();
    place(r.left, r.bottom);
    tooltip.classList.add('show');
  });
  marker.addEventListener('blur', () => tooltip.classList.remove('show'));
  marker.addEventListener('click', (e) => {
    e.stopPropagation();
    render(dept);
    place(e.clientX, e.clientY);
    tooltip.classList.toggle('show');
  });
});
document.body.addEventListener('click', () => tooltip.classList.remove('show'));
</script>
</body>
</html>
